services:
  - type: web
    name: our-forever-world
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      # MongoDB Atlas Connection URI (Add via Render Dashboard -> Environment)
      # - key: MONGO_URI
      #   sync: false
      # - key: MONGODB_URI
      #   sync: false
      # - key: MONGODB_DB_NAME
      #   value: our_forever_world
      # Cloudinary Media Storage (Add via Render Dashboard -> Environment)
      # - key: CLOUDINARY_URL
      #   sync: false
